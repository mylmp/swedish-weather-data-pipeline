name: Daily Weather Ingestion

on:
  schedule:
    # 02:00 UTC = 04:00 Sweden time during summer
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  weather-ingestion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log workflow start
        run: |
          echo "GitHub ingestion workflow started at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          python -m pip install python-dotenv
          python -m pip install azure-storage-blob
          python -c "import requests; print('requests installed')"

      - name: Run ingestion script
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          echo "Starting API fetch + Azure upload at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          python ingestion/Weather_api_ingestion.py
          echo "Finished API fetch + Azure upload at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
